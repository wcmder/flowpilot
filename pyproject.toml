[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "flowpilot"
version = "0.1.0"
description = "Agentic data-flow analysis for packet captures using PyShark and OpenAI reasoning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FlowPilot" }]
dependencies = [
  "cryptography>=42.0.0",
  "langgraph>=0.2.0",
  "openai>=1.93.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "pyshark>=0.6",
  "rich>=13.7.0",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[project.scripts]
flowpilot = "flowpilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
